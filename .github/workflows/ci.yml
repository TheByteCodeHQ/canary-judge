name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Run pytest
        shell: bash
        run: |
          pytest --tb=short > out.txt 2>&1 || { echo "::error::$(grep -E '^(E |FAILED|tests/)' out.txt | head -c 1800 | paste -sd '|' -)"; exit 1; }

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Each example gives its documented exit code (good 0, bad 1, thin 3)
        run: |
          for pair in good:0 bad:1 thin:3; do
            name=${pair%%:*}; want=${pair##*:}
            set +e
            canary-judge judge examples/$name/baseline.json examples/$name/canary.json --config examples/config.json
            got=$?
            set -e
            [ "$got" = "$want" ] || { echo "$name: expected exit $want, got $got"; exit 1; }
          done
